spring.application.name=interacciones
server.port=9093

spring.datasource.url=jdbc:mysql://localhost:3306/interacciones?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
# Usuario y contrasena de MySQL se leen de variables de entorno (DB_USER y DB_PASSWORD).
# Cada integrante pone su contrasena en IntelliJ: Run -> Edit Configurations -> Environment variables
# (por ejemplo DB_PASSWORD=miClave). Si no se define, se usa root sin contrasena, que sirve para XAMPP.
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Direcciones de los otros microservicios. interacciones les pregunta por HTTP:
# - usuarios: nombre, rol y Plan Pro de quien hace la peticion (permisos e inscripciones).
# - cursos: titulo, si es gratis y el instructor de cada curso.
# Por defecto apuntan a localhost; se pueden cambiar con las variables de entorno USUARIOS_URL y CURSOS_URL.
usuarios.url=${USUARIOS_URL:http://localhost:9091}
cursos.url=${CURSOS_URL:http://localhost:9092}
