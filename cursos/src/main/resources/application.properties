spring.application.name=cursos
server.port=9092

spring.datasource.url=jdbc:mysql://localhost:3306/cursos?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
# Usuario y contrasena de MySQL se leen de variables de entorno (DB_USER y DB_PASSWORD).
# Cada integrante pone su contrasena en IntelliJ: Run -> Edit Configurations -> Environment variables
# (por ejemplo DB_PASSWORD=miClave). Si no se define, se usa root sin contrasena, que sirve para XAMPP.
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
